<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Sistema de Arrendamiento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../static/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">

    <!-- Overlay para móvil -->
    <div id="overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-10 md:hidden" onclick="alternarMenu()"></div>

    <!-- Menú lateral -->
    <div id="menuLateral" class="menu-lateral fixed left-0 top-0 h-full w-64 shadow-lg p-6 z-20 transition-transform duration-300" style="background: linear-gradient(180deg, #f5f5f5 0%, #e8e8e8 100%);">
        <div class="mb-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">
                <i class="fas fa-store"></i> Reservas Pro
            </h1>
            <button onclick="alternarMenu()" class="md:hidden text-gray-600 text-2xl">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Navegación -->
        <nav class="space-y-2">
            <a href="#" onclick="mostrarSeccion('dashboard'); return false;" data-seccion="dashboard" class="enlace-nav flex items-center space-x-3 p-3 rounded-full bg-gradient-to-r from-pink-200 to-purple-200 shadow-sm transition-all">
                <span class="text-2xl"><i class="fas fa-chart-line"></i></span>
                <span class="font-medium text-gray-700">Panel Principal</span>
            </a>
            <a  onclick="mostrarSeccion('productos'); return false;" data-seccion="productos" class="enlace-nav flex items-center space-x-3 p-3 rounded-full hover:bg-white transition-all">
                <span class="text-2xl"><i class="fas fa-box"></i></span>
                <span class="font-medium text-gray-600">Productos</span>
            </a>
            <a  onclick="mostrarSeccion('alquileres'); return false;" data-seccion="alquileres" class="enlace-nav flex items-center space-x-3 p-3 rounded-full hover:bg-white transition-all">
                <span class="text-2xl"><i class="fas fa-calendar-check"></i></span>
                <span class="font-medium text-gray-600">Alquileres</span>
            </a>
            <a  onclick="mostrarSeccion('clientes'); return false;" data-seccion="clientes" class="enlace-nav flex items-center space-x-3 p-3 rounded-full hover:bg-white transition-all">
                <span class="text-2xl"><i class="fas fa-users"></i></span>
                <span class="font-medium text-gray-600">Clientes</span>
            </a>
            <a  onclick="mostrarSeccion('pagos'); return false;" data-seccion="pagos" class="enlace-nav flex items-center space-x-3 p-3 rounded-full hover:bg-white transition-all">
                <span class="text-2xl"><i class="fas fa-dollar-sign"></i></span>
                <span class="font-medium text-gray-600">Pagos</span>
            </a>
            <a  onclick="mostrarSeccion('estaciones'); return false;" data-seccion="estaciones" class="enlace-nav flex items-center space-x-3 p-3 rounded-full hover:bg-white transition-all">
                <span class="text-2xl"><i class="fas fa-map-marker-alt"></i></span>
                <span class="font-medium text-gray-600">Estaciones</span>
            </a>
        </nav>

        <div class="absolute bottom-6 left-6 right-6">
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center space-x-3 mb-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-300 to-purple-300 flex items-center justify-center text-white font-bold">
                        <span id="inicialUsuario">U</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p id="nombreUsuario" class="font-medium text-sm text-gray-700 truncate">Usuario</p>
                        <p id="emailUsuario" class="text-xs text-gray-500 truncate">usuario@correo.com</p>
                    </div>
                </div>
                <button onclick="cerrarSesion()" class="w-full px-3 py-2 text-sm bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-all font-medium">
                    <i class="fas fa-sign-out-alt mr-2"></i>Cerrar Sesión
                </button>
            </div>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="md:ml-64 p-4 md:p-8">
        <div id="contenidoPrincipal"></div>
    </div>

    <!-- Modal Producto -->
    <div id="modalProducto" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-2xl w-full shadow-2xl max-h-screen overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Agregar Nuevo Producto</h3>
                <button onclick="cerrarModal('modalProducto')" class="text-gray-400 hover:text-gray-600 text-3xl">&times;</button>
            </div>

            <form id="formularioProducto" onsubmit="guardarProducto(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Producto *</label>
                    <input type="text" id="nombreProducto" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="Ej: Bicicleta de Montaña">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Disponibles *</label>
                        <input type="number" id="disponiblesProducto" required min="0" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Precio *</label>
                        <input type="number" id="precioProducto" required step="0.01" min="0" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="0.00">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Producto *</label>
                    <select id="tipoProducto" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
                        <option value="Arrendamiento">Arrendamiento</option>
                        <option value="Venta">Venta</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Descripción</label>
                    <textarea id="descripcionProducto" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" rows="3" placeholder="Describe el producto..."></textarea>
                </div>

                <div class="flex space-x-4 pt-4">
                    <button type="button" onclick="cerrarModal('modalProducto')" class="flex-1 px-6 py-3 border border-gray-300 rounded-xl text-gray-700 font-medium hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="submit" class="flex-1 px-6 py-3 rounded-xl text-white font-medium" style="background: linear-gradient(135deg, #FFB5E8 0%, #DCD6F7 100%);">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Cliente -->
    <div id="modalCliente" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-2xl w-full shadow-2xl max-h-screen overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Agregar Nuevo Cliente</h3>
                <button onclick="cerrarModal('modalCliente')" class="text-gray-400 hover:text-gray-600 text-3xl">&times;</button>
            </div>

            <form id="formularioCliente" onsubmit="guardarCliente(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre *</label>
                        <input type="text" id="nombreCliente" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="Juan">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Apellido *</label>
                        <input type="text" id="apellidoCliente" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="Pérez">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">DNI *</label>
                    <input type="text" id="dniCliente" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="0801-1990-12345">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono *</label>
                        <input type="tel" id="telefonoCliente" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="9999-1111">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" id="emailCliente" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="correo@ejemplo.com">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Dirección</label>
                    <input type="text" id="direccionCliente" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="Col. Kennedy, Tegucigalpa">
                </div>

                <div class="flex space-x-4 pt-4">
                    <button type="button" onclick="cerrarModal('modalCliente')" class="flex-1 px-6 py-3 border border-gray-300 rounded-xl text-gray-700 font-medium hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="submit" class="flex-1 px-6 py-3 rounded-xl text-white font-medium" style="background: linear-gradient(135deg, #c084fc, #f9a8d4);">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Alquiler -->
    <div id="modalAlquiler" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-2xl w-full shadow-2xl max-h-screen overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Nuevo Alquiler</h3>
                <button onclick="cerrarModal('modalAlquiler')" class="text-gray-400 hover:text-gray-600 text-3xl">&times;</button>
            </div>

            <form id="formularioAlquiler" onsubmit="guardarAlquiler(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Cliente *</label>
                    <select id="clienteAlquiler" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
                        <option value="">Seleccionar cliente</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Producto *</label>
                    <select id="productoAlquiler" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
                        <option value="">Seleccionar producto</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Fecha Inicio *</label>
                        <input type="date" id="fechaInicioAlquiler" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Fecha Fin *</label>
                        <input type="date" id="fechaFinAlquiler" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Cantidad *</label>
                        <input type="number" id="cantidadAlquiler" required min="1" value="1" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Pago Inicial</label>
                        <input type="number" id="pagoInicialAlquiler" step="0.01" min="0" value="0" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Depósito</label>
                        <input type="number" id="depositoAlquiler" step="0.01" min="0" value="0" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
                    </div>
                </div>

                <div class="flex space-x-4 pt-4">
                    <button type="button" onclick="cerrarModal('modalAlquiler')" class="flex-1 px-6 py-3 border border-gray-300 rounded-xl text-gray-700 font-medium hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="submit" class="flex-1 px-6 py-3 rounded-xl text-white font-medium" style="background: linear-gradient(135deg, #AEC6FF 0%, #B5EAD7 100%);">
                        Guardar
                    </button>
                </div>
            </div>

            <!-- Modal Estacion -->
           <div id="modalEstacion" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-8 max-w-2xl w-full shadow-2xl max-h-screen overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold text-gray-800">Agregar Nueva Estación</h3>
            <button onclick="cerrarModal('modalEstacion')" class="text-gray-400 hover:text-gray-600 text-3xl">&times;</button>
        </div>

        <form id="formularioEstacion" onsubmit="guardarEstacion(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Nombre de la Estación *</label>
                <input type="text" id="nombreEstacion" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="Ej: Estación Centro">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Descripción</label>
                <textarea id="descripcionEstacion" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" rows="3" placeholder="Describe la ubicación o características de la estación..."></textarea>
            </div>

            <div class="flex space-x-4 pt-4">
                <button type="button" onclick="cerrarModal('modalEstacion')" class="flex-1 px-6 py-3 border border-gray-300 rounded-xl text-gray-700 font-medium hover:bg-gray-50">
                    Cancelar
                </button>
                <button type="submit" class="flex-1 px-6 py-3 rounded-xl text-white font-medium" style="background: linear-gradient(135deg, #c084fc, #f9a8d4);">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>


    <script src="../static/controlador.js"></script>
</body>
</html>
