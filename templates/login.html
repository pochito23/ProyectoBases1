<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema de Arrendamiento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/estilos.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);">

    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 fade-in">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl" style="background: linear-gradient(135deg, #ec4899, #8b5cf6);">
                    <i class="fas fa-store text-white"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-bold mb-2 bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">
Reservas Pro                </h1>
                <p class="text-gray-600">Gestión de alquileres y ventas</p>
            </div>

            <div class="space-y-4">
                <p class="text-center text-gray-700 font-medium mb-6">Inicia sesión para continuar</p>

                <form id="formularioLogin" class="space-y-4" >
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-user mr-2"></i>Usuario
                        </label>
                        <input
                            type="text"
                            id="usuarioInput"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all"
                            placeholder="Ingresa tu usuario">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>Contraseña
                        </label>
                        <input
                            type="password"
                            id="passwordInput"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all"
                            placeholder="••••••••">
                    </div>

                    <div id="mensajeError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-sm">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="textoError">Usuario o contraseña incorrectos</span>
                    </div>

                    <button
                        type="submit"
                        class="w-full py-3 rounded-full text-white font-semibold text-lg shadow-lg hover:shadow-xl transition-all"
                        style="background: linear-gradient(135deg, #FFB5E8 0%, #DCD6F7 100%);">
                        <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
                    </button>
                </form>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500">o</span>
                    </div>
                </div>

                <button
                    onclick="abrirModalRegistro()"
                    class="w-full py-3 rounded-full border-2 border-purple-400 text-purple-600 font-semibold hover:bg-purple-50 transition-all">
                    <i class="fas fa-user-plus mr-2"></i>Registrar Nuevo Administrador
                </button>

            </div>
        </div>
    </div>

    <div id="modalRegistro" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Registrar Administrador</h3>
                <button onclick="cerrarModalRegistro()" class="text-gray-400 hover:text-gray-600 text-3xl">&times;</button>
            </div>

            <form id="formularioRegistro" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre completo *</label>
                    <input
                        type="text"
                        id="nombreRegistro"
                        required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300"
                        placeholder="Ej: Juan Pérez">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Usuario *</label>
                    <input
                        type="text"
                        id="usuarioRegistro"
                        required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300"
                        placeholder="Ej: juanperez">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Correo electrónico *</label>
                    <input
                        type="email"
                        id="emailRegistro"
                        required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300"
                        placeholder="juan@correo.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña *</label>
                    <input
                        type="password"
                        id="passwordRegistro"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300"
                        placeholder="Mínimo 6 caracteres">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar contraseña *</label>
                    <input
                        type="password"
                        id="confirmarPasswordRegistro"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300"
                        placeholder="Repite la contraseña">
                </div>

                <div class="flex space-x-4 pt-4">
                    <button
                        type="button"
                        onclick="cerrarModalRegistro()"
                        class="flex-1 px-6 py-3 border border-gray-300 rounded-xl text-gray-700 font-medium hover:bg-gray-50 transition-all">
                        Cancelar
                    </button>
                    <button
                        type="submit"
                        class="flex-1 px-6 py-3 rounded-xl text-white font-medium"
                        style="background: linear-gradient(135deg, #FFB5E8 0%, #DCD6F7 100%);">
                        Registrar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../static/controlador.js"></script>
</body>
</html>
